name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A99893: ${{ secrets.A99893 }}
          BD4FDF: ${{ secrets.BD4FDF }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A99893', '')
          k2 = os.environ.get('BD4FDF', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- f7d5a4e94d38d58486816418e823ff98d3b30f876971 -->', k1) if k1 else txt
          out = out.replace('<!-- e0aebf2bad295a22821f -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
